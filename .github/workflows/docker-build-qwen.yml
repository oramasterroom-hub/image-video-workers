name: Build Qwen-Image-2512 RunPod worker

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.qwen"
      - "handler_qwen.py"
      - ".github/workflows/docker-build-qwen.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: qwen-runpod
  # 런포드는 이름표가 같으면 자기 기계에 캐시해둔 옛 이미지를 계속 쓴다.
  # handler/Dockerfile 을 고칠 때마다 이름표를 올린다.
  # v2 (2026-08-04): CPU 메모리 OOM 수정.
  #   enable_model_cpu_offload() 는 세 덩어리를 전부 CPU 에 대기시켜 37GiB 를 썼다.
  #   컨테이너 RAM 한도가 46.57GiB 라 생성 시작하며 터졌다(exit 137).
  #   → 트랜스포머·VAE 는 GPU 상주, 글 읽는 부분만 CPU 에 두고 레이어 단위로 사용.
  # v3 (2026-08-04): accelerate.cpu_offload 제거.
  #   그건 모델을 meta(빈 껍데기)로 만드는 방식이라 Qwen2_5_VL 과 안 맞아
  #   "Cannot copy out of meta tensor" 로 죽었다.
  #   → 글 읽는 부분을 평범하게 CPU 에 두고 encode_prompt(device="cpu") 로 직접 부른다.
  # v4 (2026-08-04): 터보 LoRA 스위치 추가.
  #   LORA_REPO/LORA_FILE 이 비어 있으면 v3 와 완전히 동일하게 동작한다.
  #   채워져 있으면 증류 LoRA 를 얹고 스케줄러를 갈아끼워 50스텝 → 8스텝.
  #   ⚠️ v3 는 그대로 둔다. 기존 Qwen-Image-2512 엔드포인트가 v3 를 보고 있다.
  # v5 (2026-08-04): peft 추가.
  #   v4 는 워커가 뜨자마자 죽었다 —
  #     ValueError: PEFT backend is required for this method.
  #   diffusers 의 load_lora_weights() 가 peft 를 요구하는데 안 깔려 있었다.
  #   빌드에서 USE_PEFT_BACKEND 를 직접 확인하도록 검사문도 추가했다.
  IMAGE_TAG: v5

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 파이토치 베이스 이미지가 커서 러너 디스크가 모자랄 수 있다.
      # 안 쓰는 것들을 먼저 지워 공간을 확보한다.
      - name: 디스크 공간 확보
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드 후 ghcr.io 로 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.qwen
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          provenance: false

  # 같은 태그로 덮어쓰면 옛 이미지가 태그 없이 남아 매번 쌓인다.
  cleanup:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: 태그 없는 옛 이미지 삭제
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: qwen-runpod
          package-type: container
          min-versions-to-keep: 1
          delete-only-untagged-versions: true
