name: Build Krea2 ComfyUI RunPod worker

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.krea2"
      - "handler_krea2.py"
      - ".github/workflows/docker-build-krea2.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: krea2-runpod
  # 런포드는 이름표가 같으면 자기 기계에 캐시해둔 옛 이미지를 계속 쓴다.
  # handler/Dockerfile 을 고칠 때마다 이름표를 올린다.
  # v1 (2026-08-04): 최초. Krea 2 Raw fp8_scaled + Turbo LoRA 0.6 + 12스텝.
  #   ComfyUI v0.29.2 고정 / CUDA 12.8.1 + torch cu128.
  #   ⚠️ 빌드 실패. cu128 인덱스의 최신인 torch 2.11.0 은 GPU 없는 빌드 머신에서
  #      get_arch_list() 가 빈 목록을 돌려줘 sm_120 검사가 통과할 수 없었다.
  # v2 (2026-08-04): 베이스를 Qwen 워커와 같은 것으로 바꿈.
  #   pytorch/pytorch:2.13.0-cuda13.0-cudnn9-runtime
  #   이 판은 GPU 없이도 ['sm_75'...'sm_120'] 을 제대로 찍는다(Qwen 빌드 로그로 확인).
  #   그리고 hf_transfer 가 더는 쓰이지 않는다는 것을 로그에서 확인해 hf_xet 으로 바꿈.
  # v3 (2026-08-04): Krea2 확인문이 GPU 없는 빌드 머신에서 죽던 것 수정.
  #   comfy.sd 를 import 하면 model_management 가 즉시 CUDA 를 초기화한다.
  #   --cpu 를 넘겨 cpu_state 를 CPU 로 만든 뒤 import 하도록 바꿈.
  #   ⭐ v2 에서 통과한 것: torch 2.13.0+cu130 / arch list 에 sm_120 있음 /
  #      huggingface_hub 0.36.2 + hf_xet OK / ComfyUI CPU 기동 + 커스텀 노드 로드
  # v4 (2026-08-04): Krea2 확인문을 통째로 삭제.
  #   v2·v3 실패가 전부 이 줄 하나에서 났다. 정작 워커는 v2 부터 멀쩡했다.
  #   ComfyUI 를 v0.29.2 로 고정했고 그 태그 소스에서 CLIPType.KREA2 = 32 를
  #   이미 확인했다. 안 변하는 것을 빌드마다 다시 확인할 이유가 없었다.
  IMAGE_TAG: v4

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ComfyUI + torch cu128 이 커서 러너 디스크가 모자랄 수 있다.
      # 안 쓰는 것들을 먼저 지워 공간을 확보한다.
      - name: 디스크 공간 확보
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드 후 ghcr.io 로 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.krea2
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          provenance: false

      # ⭐ ④ 도커 이미지 크기 실측 — 조사로는 못 알아내서 여기서 잰다 (보스 지시)
      - name: 이미지 크기 재기
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker pull "$IMG"
          echo "=============================================="
          # ⚠️ 고 템플릿에는 div 함수가 없다. 여기서 계산하지 말고 셸에서 나눈다
          #    (2026-08-04 v4 빌드에서 이 줄 때문에 스텝이 실패했다.
          #     이미지는 이미 빌드·푸시가 끝난 뒤였다)
          BYTES=$(docker image inspect "$IMG" --format '{{.Size}}')
          echo "압축 해제 크기: $BYTES 바이트 ($((BYTES / 1048576)) MB)"
          echo "=============================================="

  # 같은 태그로 덮어쓰면 옛 이미지가 태그 없이 남아 매번 쌓인다.
  cleanup:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: 태그 없는 옛 이미지 삭제
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: krea2-runpod
          package-type: container
          min-versions-to-keep: 1
          delete-only-untagged-versions: true
