name: Build Krea2 ComfyUI RunPod worker

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.krea2"
      - "handler_krea2.py"
      - "krea2_core.py"
      - ".github/workflows/docker-build-krea2.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: krea2-runpod
  # 런포드는 이름표가 같으면 자기 기계에 캐시해둔 옛 이미지를 계속 쓴다.
  # handler/Dockerfile 을 고칠 때마다 이름표를 올린다.
  # v1 (2026-08-04): 최초. Krea 2 Raw fp8_scaled + Turbo LoRA 0.6 + 12스텝.
  #   ComfyUI v0.29.2 고정 / CUDA 12.8.1 + torch cu128.
  #   ⚠️ 빌드 실패. cu128 인덱스의 최신인 torch 2.11.0 은 GPU 없는 빌드 머신에서
  #      get_arch_list() 가 빈 목록을 돌려줘 sm_120 검사가 통과할 수 없었다.
  # v2 (2026-08-04): 베이스를 Qwen 워커와 같은 것으로 바꿈.
  #   pytorch/pytorch:2.13.0-cuda13.0-cudnn9-runtime
  #   이 판은 GPU 없이도 ['sm_75'...'sm_120'] 을 제대로 찍는다(Qwen 빌드 로그로 확인).
  #   그리고 hf_transfer 가 더는 쓰이지 않는다는 것을 로그에서 확인해 hf_xet 으로 바꿈.
  # v3 (2026-08-04): Krea2 확인문이 GPU 없는 빌드 머신에서 죽던 것 수정.
  #   comfy.sd 를 import 하면 model_management 가 즉시 CUDA 를 초기화한다.
  #   --cpu 를 넘겨 cpu_state 를 CPU 로 만든 뒤 import 하도록 바꿈.
  #   ⭐ v2 에서 통과한 것: torch 2.13.0+cu130 / arch list 에 sm_120 있음 /
  #      huggingface_hub 0.36.2 + hf_xet OK / ComfyUI CPU 기동 + 커스텀 노드 로드
  # v4 (2026-08-04): Krea2 확인문을 통째로 삭제.
  #   v2·v3 실패가 전부 이 줄 하나에서 났다. 정작 워커는 v2 부터 멀쩡했다.
  #   ComfyUI 를 v0.29.2 로 고정했고 그 태그 소스에서 CLIPType.KREA2 = 32 를
  #   이미 확인했다. 안 변하는 것을 빌드마다 다시 확인할 이유가 없었다.
  # v5 (2026-08-05): 부품을 전부 환경변수로 뺐다.
  #   MODEL_REPO/MODEL_FILE/TE_*/VAE_*/LORA_*/LORA_STRENGTH/STEPS
  #   → 앞으로는 재빌드 없이 템플릿 값만 바꿔 어떤 조합이든 시험할 수 있다.
  #   LORA_FILE 이 비면 LoRA 노드를 아예 안 끼운다 (Turbo 체크포인트용).
  #   그리고 안 쓰는 폴백 다운로드를 없앴다 — Raw GGUF 12.76GiB 를 매번 받고
  #   한 번도 안 썼다. 콜드스타트에서 25초를 버리고 있었다.
  #   ⚠️ v4 는 그대로 둔다. Krea2-Raw-TurboLoRA 엔드포인트가 v4 를 보고 있다.
  # v6 (2026-08-05): 첫 Krea Turbo 실행 실패 두 건 수정.
  #   ① 파일 경로 — realrebelai 는 TURBO/ 하위폴더를 써서 파일이
  #      models/unet/TURBO/ 로 들어갔는데 워크플로엔 파일명만 적어 ComfyUI 가 거부했다.
  #      Value not in list: _Krea-2-Turbo-Q8_0.gguf_ not in [_TURBO/Krea-2-Turbo-Q8_0.gguf_]
  #      → 저장소 구조와 무관하게 우리가 정한 폴더에 파일명만으로 놓는다.
  #   ② LoRA 끄기 — 런포드가 빈 문자열/공백 환경변수를 컨테이너에 안 넣는다.
  #      LORA_FILE=" " 로 우회했는데 실패해서 기본값(Turbo LoRA)이 되살아났다.
  #      → none / off / - 같은 명시적 값으로 끈다.
  # v7 (2026-08-06): 다중 LoRA + 스텝 분기. 명세는 logb/명세_워커v7_다중LoRA_스텝분기.md
  #   ① LoRA 를 여러 개 쓸 수 있다. LORA_FILE/LORA_REPO/LORA_STRENGTH 를 쉼표로 나열한다.
  #      워크플로에서 LoraLoaderModelOnly 를 사슬로 잇는다(노드 40,41,42…).
  #      공식 노드 설명에도 "여러 LoRA 노드를 이어 붙일 수 있다"고 적혀 있다.
  #   ② LORA_START_STEP — LoRA 를 몇 번째 스텝부터 걸지. 0 이면 v6 과 동일.
  #      0 보다 크면 KSamplerAdvanced 두 개로 나눠 앞구간은 LoRA 없는 원본으로 돌린다.
  #      확산 모델은 구도가 초반 스텝에서 정해지므로 구도는 원본이 잡고
  #      체형·질감만 LoRA 가 입히게 하려는 것이다. 구도 잘림 대책.
  #      ⚠️ 원인 후보 6개(프롬프트 길이·문구·강도·샘플러·비율·제작자 트리거문구)를
  #         2026-08-06 에 실측으로 전부 배제한 뒤 남은 마지막 수단이다.
  #   ③ 기본 샘플러를 euler → er_sde 로. 체형 LoRA 제작자 권장값이고
  #      실측에서 필름 입자감·모공이 살아났다. 속도 손해도 없었다(34.2초 vs 35.2초).
  #   ④ WIDTH/HEIGHT 를 환경변수로 뺐다. 원래 Qwen 의 9:16 값이 코드에 박혀 있었다.
  #   ⚠️ 검사문을 일절 안 붙였다. v2~v4 실패가 전부 내가 덧붙인 검사문 때문이었다.
  # v8 (2026-08-06): LoRA 층 선택. 명세는 logb/명세_워커v8_LoRA층선택.md
  #   LORA_SKIP_KEYS — LoRA 에서 뺄 텐서를 이름 조각으로 지정한다(쉼표 구분, 대소문자 무시).
  #   워커가 뜰 때 safetensors 를 열어 해당 텐서를 뺀 뒤 덮어쓴다. 비우면 v7 과 완전히 동일.
  #     LORA_SKIP_KEYS=txtfusion  → 512개 중 64개 제외 (프롬프트 해석부)
  #     LORA_SKIP_KEYS=blocks.    → 448개 제외 (이미지 생성층). 점을 붙여야 refiner_blocks 와 안 겹침
  #   왜: 체형 LoRA 를 얹으면 특정 부위에 검열(블러·모자이크·착의)이 그려진다.
  #       LoRA 없으면 안 걸리고 강도가 셀수록 심해지는 것을 실측했고,
  #       코드(handler/Dockerfile/ComfyUI/GGUF로더/텍스트인코더)에는 검열이 0건임을 확인했다.
  #       프롬프트·cfg·강도·스텝으로는 통제가 안 돼서 LoRA 파일 자체를 거르는 방향으로 갔다.
  #   ⚠️ "txtfusion 이 원인"은 추정이다. 그래서 무엇을 뺄지 고를 수 있게 만들었다.
  #   ⚠️ 기존 코드는 한 줄도 안 고쳤다(75줄 추가, 0줄 삭제). 검사문도 안 붙였다.
  # ⭐ v9 (2026-08-11): 껍데기·몸통 분리 + 로라 카탈로그 + 주소로 직접 부르기
  #    + capabilities + workflow 통째로 던지기 + stock(순정)
  #    v7·v8 기능(스텝 분기 / LORA_SKIP_KEYS)은 그대로 살아 있다.
  #    ⚠️ 요청에 loras 를 안 보내면 v8 과 똑같이 동작해야 한다. 그게 회귀 검증 기준이다.
  IMAGE_TAG: v9

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ComfyUI + torch cu128 이 커서 러너 디스크가 모자랄 수 있다.
      # 안 쓰는 것들을 먼저 지워 공간을 확보한다.
      - name: 디스크 공간 확보
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드 후 ghcr.io 로 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.krea2
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          provenance: false

      # ⭐ ④ 도커 이미지 크기 실측 — 조사로는 못 알아내서 여기서 잰다 (보스 지시)
      - name: 이미지 크기 재기
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker pull "$IMG"
          echo "=============================================="
          # ⚠️ 고 템플릿에는 div 함수가 없다. 여기서 계산하지 말고 셸에서 나눈다
          #    (2026-08-04 v4 빌드에서 이 줄 때문에 스텝이 실패했다.
          #     이미지는 이미 빌드·푸시가 끝난 뒤였다)
          BYTES=$(docker image inspect "$IMG" --format '{{.Size}}')
          echo "압축 해제 크기: $BYTES 바이트 ($((BYTES / 1048576)) MB)"
          echo "=============================================="

  # 같은 태그로 덮어쓰면 옛 이미지가 태그 없이 남아 매번 쌓인다.
  cleanup:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: 태그 없는 옛 이미지 삭제
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: krea2-runpod
          package-type: container
          min-versions-to-keep: 1
          delete-only-untagged-versions: true
